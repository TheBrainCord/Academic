name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "iot-at-christ/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "iot-at-christ/**"

defaults:
  run:
    working-directory: iot-at-christ

jobs:
  ci:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: iot-at-christ/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:run
        env:
          # Stub env vars so tests don't crash on missing Supabase config
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          ANTHROPIC_API_KEY: placeholder-anthropic-key
          RESEND_API_KEY: placeholder-resend-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
